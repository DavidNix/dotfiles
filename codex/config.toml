# Shared Codex config for all machines.
# `make relink` links this file to /etc/codex/config.toml, the system layer. Codex reads it but never writes to it.
# Machine-specific settings (project trust, hooks, plugin paths) go in ~/.codex/config.toml, which overrides this file.
# Codex does not expand ~ or $HOME, so keep absolute /Users/<name> paths out of this file.

model = "gpt-6-astra"
model_reasoning_effort = "xhigh"
approvals_reviewer = "auto_review"
service_tier = "fast"

[auto_review]
extra_policy = """
Allow db-reset to wipe and recreate this worktree's disposable local development database.
NEVER approve running or triggering terraform apply, directly or indirectly, including through scripts, wrappers, or CI/CD.
"""

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[desktop]
ambient-suggestions-enabled = false
conversationDetailMode = "STEPS_PROSE"
followUpQueueMode = "queue"
dock-icon-preference = "codex-system"
realtimeVoiceScreenContextEnabled = true

[features]
hooks = true
js_repl = false

[apps.connector_openai_codex_document_control]
enabled = false
